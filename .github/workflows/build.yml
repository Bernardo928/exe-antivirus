name: Testes e build (Windows + Linux)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libgl1

      - name: Dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Testes automatizados
        run: python -m pytest -v

      - name: Autoteste pelo código-fonte
        run: python main.py --selftest

      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Compilar (PyInstaller + instalador .exe / AppImage)
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then python tools/build.py --onefile --installer
          else python tools/build.py --onefile --appimage; fi

      - name: Testar executável compilado (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:EXEAV_DATA_DIR = "$env:RUNNER_TEMP\exeav-data"
          $p = Start-Process -FilePath "dist\ExeAntivirus\ExeAntivirus.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "autoteste falhou: $($p.ExitCode)" }
          $p = Start-Process -FilePath "dist\ExeAntivirus\ExeAntivirus.exe" -ArgumentList "--smoke-test","$env:RUNNER_TEMP\tela.png" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "teste da interface falhou: $($p.ExitCode)" }
          Copy-Item "$env:RUNNER_TEMP\tela.png" dist\captura-windows.png
          $exe = Get-ChildItem dist\*-portatil.exe | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "autoteste do portátil falhou: $($p.ExitCode)" }

      - name: Testar instalador (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $inst = Get-ChildItem dist\*-instalador.exe | Select-Object -First 1
          $p = Start-Process $inst.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS="autostart,pslog,desktopicon"',"/LOG=$env:RUNNER_TEMP\instalacao.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\instalacao.log" -Tail 40; throw "instalação falhou: $($p.ExitCode)" }
          $dir = "$env:ProgramFiles\EXE Antivirus"
          if (!(Test-Path "$dir\ExeAntivirus.exe")) { throw "programa não foi instalado" }
          if (!(Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\EXE Antivirus\EXE Antivirus.lnk")) { throw "atalho do menu Iniciar não criado" }
          $p = Start-Process "$dir\ExeAntivirus.exe" -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "autoteste do programa instalado falhou" }
          schtasks /Query /TN "EXE Antivirus" /V /FO LIST
          if ($LASTEXITCODE -ne 0) { throw "tarefa de inicialização não criada" }
          $v = (Get-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging').EnableScriptBlockLogging
          if ($v -ne 1) { throw "registro de scripts do PowerShell não ligado" }
          Write-Host "Instalação OK — desinstalando"
          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          for ($i = 0; $i -lt 90 -and (Test-Path "$dir\ExeAntivirus.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$dir\ExeAntivirus.exe") { throw "desinstalação não removeu o programa" }
          schtasks /Query /TN "EXE Antivirus" 2>$null
          if ($LASTEXITCODE -eq 0) { throw "desinstalação não removeu a tarefa" }
          $v = (Get-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging' -EA SilentlyContinue).EnableScriptBlockLogging
          if ($v -eq 1) { throw "desinstalação não desligou o registro do PowerShell" }
          Write-Host "Desinstalação OK"
          $global:LASTEXITCODE = 0

      - name: Testar AppImage (Linux)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          export EXEAV_DATA_DIR=$RUNNER_TEMP/exeav-appimage
          A=$(ls dist/*.AppImage)
          "$A" --selftest
          "$A" --smoke-test dist/captura-appimage.png
          export HOME=$RUNNER_TEMP/home && mkdir -p "$HOME"
          "$A" --install-system --autostart
          test -f "$HOME/.local/share/applications/exe-antivirus.desktop"
          grep -q -- "--boot" "$HOME/.config/autostart/exe-antivirus.desktop"
          grep -q "$A" "$HOME/.local/share/applications/exe-antivirus.desktop" || grep -q "AppImage" "$HOME/.local/share/applications/exe-antivirus.desktop"
          "$A" --uninstall-system
          test ! -f "$HOME/.local/share/applications/exe-antivirus.desktop"
          test ! -f "$HOME/.config/autostart/exe-antivirus.desktop"

      - name: Testar executável compilado (Linux)
        if: runner.os == 'Linux'
        run: |
          export EXEAV_DATA_DIR=$RUNNER_TEMP/exeav-data
          dist/ExeAntivirus/ExeAntivirus --selftest
          dist/ExeAntivirus/ExeAntivirus --smoke-test dist/captura-linux.png
          ./dist/*-portatil --selftest

      - uses: actions/upload-artifact@v4
        with:
          name: ExeAntivirus-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*-portatil*
            dist/*-instalador.exe
            dist/*.AppImage
            dist/captura-*.png
          if-no-files-found: error
